const keys=[1,2,3,4,5,6,7,8,9,'',0,'⌫'];
const kk=()=>keys.map(k=>{const p=typeof k==='number'&&k>=1&&k<=4;return `<span class="${k===''?'z ':''}${p?'p':''}"${p?` style="--d:${.6*k}s"`:''}>${k}</span>`}).join('');
const pinH=s=>`<div class="pin" style="${s||''}">${[0,1,2,3].map(j=>`<b style="--d:${.9+.6*j}s"></b>`).join('')}</div>`;
const T=(t,d)=>`<span class="tp" style="--n:${t.length};--d:${d}s">${t}</span>`;
const CODE=`<div class="cd">${'482 913'.split('').map((c,j)=>c==' '?'&nbsp;':`<span class="dg" style="--i:${j}">${c}</span>`).join('')}</div>`;
/* iPhone */
const sb=()=>`<div class="sb"><span>9:41</span><span>●●● ▮</span></div>`;
const ic=c=>`<span class="ic" style="background:${c}"></span>`;
const R=(l,o={})=>`<div class="r${o.c?' c':''}${o.h?' hl':''}">${o.i?ic(o.i):''}<span>${l}</span>${o.v?`<span class="v">${o.v}</span>`:''}${o.t?'<span class="tg"></span>':''}</div>`;
const nav=(a,t,b,h)=>`<div class="nav"><i>${a}</i><b>${t}</b><i class="${h?'hl late':''}"${h?' style="--ld:3.5s"':''}>${b}</i></div>`;
const phone=x=>`<div class="ph"><div class="sc">${sb()}${x}</div></div>`;
/* Android */
const shield=`<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>`;
const abar=(t,acts,back)=>`<div class="ab"><span style="display:flex">${back?'<span class="bk">←</span>':''}${t}</span><span class="a2">${acts||''}</span></div>`;
const AR=(l,o={})=>`<div class="ar${o.h?' hl':''}">${o.i?`<span class="ai" style="background:${o.i}"></span>`:''}<span>${l}</span></div>`;
const droid=x=>`<div class="an"><div class="as"><div class="asb"><span>9:41</span><span>▾ ▮</span></div>${x}<div class="gp"></div></div></div>`;
/* Desktop */
function qr(){let s='',n=25;const f=(r,c)=>{for(const[a,b]of[[3,3],[3,n-4],[n-4,3]])if(Math.abs(r-a)<=3&&Math.abs(c-b)<=3){const d=Math.max(Math.abs(r-a),Math.abs(c-b));return d==3||d<=1}return null};
for(let r=0;r<n;r++)for(let c=0;c<n;c++){let v=f(r,c);if(v===null)v=((r*31+c*17+r*c*7)%11)<5;if(v)s+=`<rect x="${c}" y="${r}" width="1.02" height="1.02"/>`}
return`<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges">${s}</svg>`}
const chart=`<svg viewBox="0 0 230 150" preserveAspectRatio="xMidYMid meet"><g font-family="Impact,Anton,'Arial Narrow',sans-serif" fill="#000" text-anchor="middle"><text x="115" y="68" font-size="33" textLength="176" lengthAdjust="spacingAndGlyphs">XAUUSD.d,M15</text><text x="115" y="108" font-size="33" textLength="212" lengthAdjust="spacingAndGlyphs">Gold vs US Dollar</text></g></svg>`;
const tree=(sel)=>`<div class="nr2"><b class="ar2">▾</b><u class="fo"></u>Accounts</div><div class="nr2 s1"><b class="ar2">▾</b><u class="sv"></u>MentoMarkets-Server</div><div class="nr2 ac ${sel?'sel':''}"><u class="us2"></u>12345678: Client</div>`+['Subscriptions','Indicators','Expert Advisors','Scripts'].map(x=>`<div class="nr2"><b class="ar2">▸</b><u class="fo"></u>${x}</div>`).join('');
const base=sel=>`<div class="wt"><i class="lg"></i><span class="tx">12345678 - MentoMarkets-Server - Hedge - Mento Markets Ltd. - [XAUUSD.d,M15]</span><span class="wc">—&nbsp;&nbsp;▢&nbsp;&nbsp;✕</span></div><div class="mb"><span>File</span><span>View</span><span>Insert</span><span>Charts</span><span>Tools</span><span>Window</span><span>Help</span></div><div class="tl">${Array(12).fill('<i></i>').join('')}<b class="sp"></b>${'M1 M5 M15 M30 H1 H4 D1 W1 MN'.split(' ').map(x=>`<em class="${x=='M15'?'on':''}">${x}</em>`).join('')}</div><div class="lp"><div class="ph2"><span>Market Watch: 12:59:01</span><span>✕</span></div><div class="mh"><span>Symbol</span><span>Bid</span><span>Ask</span></div><div class="mr"><span><s class="dn"></s>XAGUSD.p</span><span class="rd">42.637</span><span class="rd">42.673</span></div><div class="mr"><span><s class="up"></s>XAUUSD.p</span><span class="bl">3625.22</span><span class="bl">3625.78</span></div><div class="ph2"><span>Navigator</span><span>✕</span></div>${tree(sel)}<div class="nt"><span class="on">Common</span><span>Favorites</span><span>Chats</span></div></div><div class="cv">${chart}</div><div class="ct"><span class="on">XAUUSD.d,M15</span><span>XAUUSD.x,M1</span><span>XAUUSD.r,M5</span></div><div class="tb2"><div class="th"><span>Symbol</span><span>Ticket</span><span>Time</span><span>Type</span><span>Volume</span><span>Price</span><span>Profit</span></div><div class="tbal"><b>Balance: 1&nbsp;000.00 USD&nbsp; Equity: 1&nbsp;000.00&nbsp; Free Margin: 1&nbsp;000.00</b><b>0.00</b></div><div class="tabs2"><span class="on">Trade</span><span>Exposure</span><span>History</span><span>News</span><span>Mailbox</span><span>Calendar</span><span>Company</span><span>Alerts</span><span>Experts</span><span>Journal</span></div></div><div class="stb"><span>For Help, press F1</span><span>Default</span><span>118.30 ms</span></div>`;
const pc=x=>`<div class="pcw"><div class="pc">${x}</div></div>`;
const dlg=(t,b)=>`<div class="dm"></div><div class="dl"><div class="tb"><span>${t}</span><span>✕</span></div><div class="bd">${b}</div></div>`;
const cursor=`<svg class="cu" viewBox="0 0 24 24"><path d="M3 2l16 9-7 2 4 8-3 1.5-4-8-6 5z" fill="#000" stroke="#fff" stroke-width="1.2"/></svg>`;
const menu=`<div class="cm"><div>Open an Account<span>Insert</span></div><div>Login to Trade Account<span>Enter</span></div><div>Login to Web Trader</div><div>Login to MQL5.community</div><hr><div>Change Password</div><div class="en">Enable 2FA/TOTP</div><div>Delete<span>Delete</span></div><hr><div>Add to Favorites</div><div>Register as Signal</div><div>Register a Virtual Server</div></div><div class="hb2"></div>`;
const dlgQR=t=>`<div class="dm"></div><div class="dl"${t?' style="animation:inx .4s both,dlo .4s 4s forwards"':''}><div class="tb"><span>Enable 2FA/TOTP</span><span>✕</span></div><div class="bd"><p>Scan the QR code with your authenticator app</p><div class="qrb">${qr()}</div><div class="fl"><span>One-Time Password</span><div class="in ${t?'hl2':''}">${t?'<span class="ty">482913</span>':''}</div></div><div class="bt"><span class="${t?'hl2 bp':''}">Enable 2FA</span><span>Cancel</span></div></div></div>${t?`<div class="ok"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>${cursor.replace('class="cu"','class="cu c2"')}`:''}`;
const M=[[
{c:'Open Accounts and tap the OTP icon.',u:()=>droid(abar('Accounts',`<span class="ib">+</span><span class="ib rg">${shield}</span>`)+`<div class="ar" style="height:70px"><span class="av">C</span><span>Client Name<br><small>MentoMarkets-Server · 12345678</small></span></div>`)},
{c:'Set a four-digit password.',u:()=>droid(abar('OTP','',1)+pinH('margin-top:40px')+`<div class="ak">${kk()}</div>`)},
{c:'Tap Bind to account.',u:()=>droid(abar('OTP','',1)+AR('Bind to account',{h:1})+AR('Change password')+AR('Synchronize time'))},
{c:'Enter your server, account number and password, then tap Bind.',ms:6500,u:()=>droid(abar('Bind to account',`<span class="ib rg pl late" style="font-size:13px;font-weight:500;padding:0 10px;--ld:3.6s">BIND</span>`,1)+`<div class="fld"><small>Server</small>${T('MentoMarkets-Server',.4)}</div><div class="fld"><small>Login</small>${T('12345678',1.9)}</div><div class="fld"><small>Password</small>${T('••••••••',2.7)}</div><div class="sw"><span>Bind</span><span class="t2"></span></div>`)},
{c:'Use the six-digit code when you log in.',u:()=>droid(abar('OTP','',1)+`<div class="otp"><small>One-time password</small>${CODE}<svg class="ring" viewBox="0 0 54 54"><circle class="a" cx="27" cy="27" r="21"/><circle class="b" cx="27" cy="27" r="21"/></svg></div>`)}
],[
{c:'Open Settings and tap OTP.',u:()=>phone(nav('','Settings','')+`<div class="lst">${R('Quotes',{i:'#ff9500',c:1})}${R('Chart',{i:'#34c759',c:1})}${R('Trade',{i:'#5856d6',c:1})}${R('Journal',{i:'#8e8e93',c:1})}${R('OTP',{i:'#0693e3',c:1,h:1})}${R('Messages',{i:'#ff3b30',c:1})}${R('About',{i:'#8e8e93',c:1})}</div>`)},
{c:'Set a four-digit password.',u:()=>phone(nav('','Set password','')+pinH()+`<div class="kp">${kk()}</div>`)},
{c:'Tap Bind to account.',u:()=>phone(nav('','OTP','')+`<div class="lst">${R('Bind to account',{c:1,h:1})}${R('Change password',{c:1})}${R('Synchronize time',{c:1})}</div>`)},
{c:'Enter your server, account number and password, then tap Bind.',ms:6500,u:()=>phone(nav('Cancel','Bind to account','Bind',1)+`<div class="lst">${R('Server',{v:T('MentoMarkets-Server',.4)})}${R('Login',{v:T('12345678',1.9)})}${R('Password',{v:T('••••••••',2.7)})}${R('Bind',{t:1})}</div>`)},
{c:'Use the six-digit code when you log in.',u:()=>phone(nav('','OTP','')+`<div class="otp"><small>One-time password</small>${CODE}<svg class="ring" viewBox="0 0 54 54"><circle class="a" cx="27" cy="27" r="21"/><circle class="b" cx="27" cy="27" r="21"/></svg></div>`)}
],[
{c:'Right-click your account in Navigator and select Enable 2FA/TOTP.',ms:6500,u:()=>pc(base(1)+menu+cursor)},
{c:'Scan the QR code with your authenticator app.',u:()=>pc(base()+dlgQR(0))},
{c:'Enter the six-digit code and click Enable 2FA.',ms:6800,u:()=>pc(base()+dlgQR(1)),post:()=>{const p=document.querySelector('.pc'),b=p.querySelector('.bt .bp'),c=p.querySelector('.c2');if(!b||!c)return;const q=p.getBoundingClientRect(),r=b.getBoundingClientRect(),e=parseFloat(getComputedStyle(p).fontSize),k=q.width/p.offsetWidth;c.style.setProperty('--tx',((r.left+r.width*.5-q.left)/k/e)+'em');c.style.setProperty('--ty',((r.top+r.height*.4-q.top)/k/e)+'em')}},
{c:'Enter the code each time you log in.',ms:6000,u:()=>pc(base()+dlg('Login',`<div class="fl"><span>Login</span><div class="in">${T('12345678',.3)}</div><span>Password</span><div class="in">${T('••••••••',1.0)}</div><span>Server</span><div class="in">${T('MentoMarkets-Server',1.7)}</div><span>One-Time Password</span><div class="in hl2"><span class="ty" style="--d:3s">482913</span></div></div><div class="bt"><span class="okb">OK</span><span>Cancel</span></div>`))}
]];
let tab=0,i=0,tm,busy=0;
function show(){const s=M[tab][i],D=s.ms||4500;$('stage').className='stage'+(tab==2?' dsk':'');$('stage').innerHTML=s.u();s.post&&s.post();$('cap').textContent=s.c;
$('dots').innerHTML=M[tab].map((_,k)=>`<span class="${k==i?'on':''}"></span>`).join('');
const p=$('pr');p.style.transition='none';p.style.width='0';void p.offsetWidth;p.style.transition=`width ${D}ms linear`;p.style.width='100%';clearTimeout(tm);tm=setTimeout(()=>go(i+1),D);busy=0}
function go(n){if(busy)return;busy=1;clearTimeout(tm);const L=M[tab].length,ch=$('stage').firstElementChild;if(ch)ch.classList.add('out');setTimeout(()=>{i=(n+L)%L;show()},ch?260:0)}
$('prev').onclick=()=>go(i-1);$('next').onclick=()=>go(i+1);
[0,1,2].forEach(n=>$('t'+n).onclick=()=>{tab=n;i=0;busy=0;[0,1,2].forEach(k=>$('t'+k).className=k==n?'on':'');show()});
show();
</script></body></html>
